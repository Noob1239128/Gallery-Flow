name: Build & Release Lumina APK (Obtainium)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure release signing keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/upload-keystore.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "Using repository signing secrets."
          else
            AUTO_PASS="lumina-release-key-2026"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "$AUTO_PASS" \
              -keypass "$AUTO_PASS" \
              -dname "CN=Lumina Gallery, O=Lumina, C=DE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$AUTO_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$AUTO_PASS" >> "$GITHUB_ENV"
            echo "No signing secrets found; generated temporary release keystore."
          fi

      - name: Determine release version tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK asset for Obtainium
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Release APK not found at $APK_SRC"
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_SRC" "release-assets/Lumina-${RELEASE_TAG}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lumina ${{ env.RELEASE_TAG }}
          body: |
            Lumina Fotogalerie Release **${{ env.RELEASE_TAG }}**.
            Direkt über **Obtainium** installierbar (Repo-URL in Obtainium einfügen).
          files: release-assets/Lumina-*.apk
          draft: false
          prerelease: false
